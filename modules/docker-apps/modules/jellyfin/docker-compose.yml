services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - DOMAIN_NAME
      # .NET's own X509Chain builder doesn't reliably trust the step-ca root via the bundled
      # ca-certificates.crt alone (confirmed: curl using that same bundle verifies fine, but the
      # SSO-Auth plugin's own OIDC discovery fetch failed with NotTimeValid regardless) - pointing
      # it at a directory containing the standalone root cert fixes it. See:
      # https://github.com/9p4/jellyfin-plugin-sso/issues/215#issuecomment-2830669850
      - SSL_CERT_DIR=/usr/local/share/ca-certificates
    ports:
      - "8096:8096"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /etc/ssl/certs/step-ca-root.pem:/usr/local/share/ca-certificates/step-ca-root.crt:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Videos
      - /mnt/video:/media/video
      - /mnt/picture:/media/picture
      - /mnt/photo:/media/photo
      - /mnt/music:/media/music
      - /mnt/yuliia:/media/yuliia
    networks:
      - service-network
    labels:
      - "traefik.enable=true"
      - "traefik-tier=services"
      - "traefik.docker.network=service-network"
      # Web UI
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${BASE_DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-redirect-to-web"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      # Redirect to /web
      - "traefik.http.middlewares.jellyfin-redirect-to-web.redirectregex.regex=^https:\\/\\/([^\\/]+)\\/?$$"
      - "traefik.http.middlewares.jellyfin-redirect-to-web.redirectregex.replacement=https://$$1/web/index.html"
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 16g

networks:
  service-network:
    name: service-network
    external: true

volumes:
  jellyfin-config:
    external: true
  jellyfin-cache:
    external: true
