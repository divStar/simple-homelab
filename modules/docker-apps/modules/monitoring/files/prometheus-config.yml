global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'docker-cluster'
    environment: 'production'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker daemon metrics (exposed on host)
  - job_name: 'docker-daemon'
    static_configs:
      - targets: ['docker-management.my.world:9323']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

  # Scrape SMART status of disks
  - job_name: 'smartctl'
    static_configs:
      - targets: ['sanctum.my.world:9633']

  # Scrape host-level metrics (CPU, memory, network interfaces, etc.)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['sanctum.my.world:9100']
      - targets: ['opnsense.my.world:9100']
      - targets: ['flint2.my.world:9100']

  # Grafana Alloy self-monitoring
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # mqtt-exporter - Tasmota smart plug telemetry via Mosquitto
  - job_name: 'mqtt-exporter'
    static_configs:
      - targets: ['mqtt-exporter:9000']