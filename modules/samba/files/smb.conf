[global]
    workgroup = WORKGROUP
    server string = Alpine Samba Server
    security = user
    map to guest = Bad User
    log file = /var/log/samba/%m.log
    max log size = 50

    # Defaults for all shares
    read only = yes
    browseable = yes
    create mask = 0775
    directory mask = 0775

[application]
    path = /mnt/application
    valid users = igor, yuliia
    write list = igor, yuliia

[backup]
    path = /mnt/backup
    valid users = igor, yuliia
    write list = igor, yuliia

[document]
    path = /mnt/document
    valid users = igor, yuliia, mariia
    write list = igor, yuliia

[scan]
    path = /mnt/scan
    valid users = igor, yuliia, mariia, scan
    write list = igor, yuliia, scan

[music]
    path = /mnt/music
    valid users = igor, yuliia, mariia
    write list = igor, yuliia

[photo]
    path = /mnt/photo
    valid users = igor, yuliia, mariia
    write list = igor, yuliia, mariia

[picture]
    path = /mnt/picture
    valid users = igor, yuliia
    write list = igor, yuliia
    hide files = /moe.imouto.org/

[temp]
    path = /mnt/temp
    valid users = igor, yuliia
    write list = igor, yuliia

[video]
    path = /mnt/video
    valid users = igor, yuliia, mariia
    write list = igor, yuliia, mariia
    veto files = /e-movies/

[yuliia]
    path = /mnt/yuliia
    valid users = igor, yuliia, mariia
    write list = igor, yuliia

[macbook-m1-pro]
    path = /mnt/macbook-m1-pro
    comment = Igor's MacBook Pro M1 Time Machine backups
    valid users = igor
    write list = igor
    read only = no
    browseable = yes
    guest ok = no
    create mask = 0775
    directory mask = 0775
    vfs objects = catia fruit streams_xattr
    fruit:aapl = yes
    fruit:time machine = yes
    fruit:time machine max size = 2T
    fruit:advertise_fullsync = true
    fruit:encoding = native
    fruit:metadata = stream
    fruit:resource = file
    fruit:locking = netatalk
    fruit:zero_file_id = yes
    fruit:veto_appledouble = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes
